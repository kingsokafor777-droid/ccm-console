name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: corepack enable && cd apps/web && pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade pip && python -m pip install -e . -r requirements-dev.txt
      - run: PYTHONPATH=apps/api python scripts/build_fixtures.py
      - run: git diff --exit-code -- fixtures
      - run: make quality
      - run: make package-check
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && python -m pip install -e . -r requirements-dev.txt
      - run: PYTHONPATH=apps/api python scripts/build_fixtures.py && PYTHONPATH=apps/api pytest tests/api
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: corepack enable && cd apps/web && pnpm install --frozen-lockfile
      - run: cd apps/web && pnpm lint && pnpm typecheck && pnpm test && pnpm build
